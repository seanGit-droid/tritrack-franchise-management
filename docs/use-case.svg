<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">TriTrack franchise management use case diagram</title><desc id="desc">Use cases derived from the Franchise Management Workflows board for franchisees, BPLO office staff, and treasury staff.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#243248} .title{font-size:28px;font-weight:700;fill:#203f79}.lane{fill:#f7f9fd;stroke:#dbe2ee;stroke-width:2}.lanehead{font-size:18px;font-weight:700;fill:#fff}.actor{fill:#203f79}.uc{fill:#fff;stroke:#4169ad;stroke-width:2}.pay{fill:#fff7ee;stroke:#c76422;stroke-width:2}.line{stroke:#9aabc4;stroke-width:2;fill:none}.label{font-size:14px}.small{font-size:12px;fill:#718097}</style></defs><rect width="1400" height="760" fill="#fff"/><text x="52" y="54" class="title">TriTrack · Franchise Management Use Cases</text><text x="52" y="80" class="small">Adapted from the supplied “Franchise Management Workflows” board</text><rect x="40" y="105" width="1320" height="190" rx="14" class="lane"/><rect x="40" y="105" width="1320" height="42" rx="14" class="actor"/><text x="62" y="133" class="lanehead">FRANCHISEE</text><rect x="80" y="190" width="175" height="58" rx="12" class="uc"/><text x="102" y="215" class="label">Register / verify</text><text x="102" y="234" class="label">account</text><rect x="315" y="190" width="175" height="58" rx="12" class="uc"/><text x="342" y="215" class="label">Submit renewal /</text><text x="342" y="234" class="label">transfer application</text><rect x="550" y="190" width="175" height="58" rx="12" class="uc"/><text x="575" y="215" class="label">Upload required</text><text x="575" y="234" class="label">documents</text><rect x="785" y="190" width="175" height="58" rx="12" class="pay"/><text x="812" y="215" class="label">Receive fee</text><text x="812" y="234" class="label">assessment</text><rect x="1020" y="190" width="175" height="58" rx="12" class="uc"/><text x="1044" y="215" class="label">Track application</text><text x="1044" y="234" class="label">and payment status</text><path d="M255 219h60M490 219h60M725 219h60M960 219h60" class="line"/><rect x="40" y="320" width="1320" height="190" rx="14" class="lane"/><rect x="40" y="320" width="1320" height="42" rx="14" class="actor"/><text x="62" y="348" class="lanehead">BPLO OFFICE</text><rect x="85" y="400" width="190" height="58" rx="12" class="uc"/><text x="120" y="425" class="label">Authenticate staff</text><text x="120" y="444" class="label">credentials</text><rect x="340" y="400" width="190" height="58" rx="12" class="uc"/><text x="373" y="425" class="label">Review submitted</text><text x="373" y="444" class="label">documents</text><rect x="595" y="400" width="190" height="58" rx="12" class="uc"/><text x="620" y="425" class="label">Assess requirements</text><text x="620" y="444" class="label">and compliance</text><rect x="850" y="400" width="190" height="58" rx="12" class="uc"/><text x="879" y="425" class="label">Approve / return</text><text x="879" y="444" class="label">application</text><rect x="1105" y="400" width="190" height="58" rx="12" class="uc"/><text x="1137" y="425" class="label">Update franchise</text><text x="1137" y="444" class="label">records</text><path d="M275 429h65M530 429h65M785 429h65M1040 429h65" class="line"/><rect x="40" y="535" width="1320" height="175" rx="14" class="lane"/><rect x="40" y="535" width="1320" height="42" rx="14" class="actor"/><text x="62" y="563" class="lanehead">TREASURY</text><rect x="120" y="615" width="210" height="58" rx="12" class="uc"/><text x="158" y="640" class="label">Search / filter</text><text x="158" y="659" class="label">transactions</text><rect x="410" y="615" width="210" height="58" rx="12" class="uc"/><text x="438" y="640" class="label">Verify payment</text><text x="438" y="659" class="label">details</text><rect x="700" y="615" width="210" height="58" rx="12" class="pay"/><text x="728" y="640" class="label">Update payment</text><text x="728" y="659" class="label">status (simulated)</text><rect x="990" y="615" width="210" height="58" rx="12" class="uc"/><text x="1021" y="640" class="label">Issue official</text><text x="1021" y="659" class="label">receipt</text><path d="M330 644h80M620 644h80M910 644h80" class="line"/><path d="M875 248V400M1195 248V400M890 458V615" class="line" stroke-dasharray="7 7"/><text x="905" y="382" class="small">status hand-off</text><text x="905" y="598" class="small">payment hand-off</text></svg>
